<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maharishi Mehi Baba — Santmat Devotional</title>
  <meta name="description" content="Official devotional audio portal for Maharishi Mehi Baba. Listen to sacred bhajans, stuti, and spiritual chants.">
  <!-- SITE ICONS & MOBILE BOOKMARK SHORTCUTS -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF8F00">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mehi Baba">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF4E6;
      --bg-gradient: radial-gradient(circle at 50% 18%, #FFE5CC 0%, #FFF3E5 55%, #FFFBF7 100%);
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 171, 92, 0.4);
      --card-shadow: 0 20px 48px rgba(224, 110, 20, 0.12), 0 4px 16px rgba(0, 0, 0, 0.03);
      --primary: #E65100;
      --primary-glow: rgba(230, 81, 0, 0.35);
      --accent: #FF8F00;
      --text: #261408;
      --text-muted: #6B4931;
      --gold-gradient: linear-gradient(135deg, #FF6F00 0%, #FF8F00 50%, #FFA000 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* AMBIENT GLOW BACKDROPS - WARM LIGHT ORANGE & SAFFRON */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
      animation: ambientPulse 12s ease-in-out infinite alternate;
    }

    .glow-1 {
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(255, 152, 0, 0.35) 0%, rgba(255, 183, 77, 0.18) 55%, transparent 80%);
    }

    .glow-2 {
      bottom: -15%;
      left: 15%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(255, 112, 67, 0.22) 0%, transparent 70%);
      animation-delay: -6s;
    }

    @keyframes ambientPulse {
      0% { transform: translateX(-50%) scale(1); opacity: 0.6; }
      100% { transform: translateX(-50%) scale(1.15); opacity: 0.85; }
    }

    /* MAIN CONTAINER */
    .main-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
    }

    /* SACRED PORTRAIT BADGE */
    .portrait-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 4px;
    }

    .portrait-aura {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF9800 0%, #FFB74D 50%, #FFE082 100%);
      opacity: 0.85;
      filter: blur(8px);
      animation: auraRotate 8s linear infinite;
    }

    .portrait-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #FFA726;
      box-shadow: 0 16px 36px rgba(224, 110, 20, 0.24), 0 0 24px rgba(255, 152, 0, 0.35);
      background: #FFF8F0;
    }

    .portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .portrait-wrapper:hover .portrait-img {
      transform: scale(1.08);
    }

    @keyframes auraRotate {
      0% { transform: rotate(0deg) scale(0.98); }
      50% { transform: rotate(180deg) scale(1.04); }
      100% { transform: rotate(360deg) scale(0.98); }
    }

    /* TITLES & HEADINGS */
    .header-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hindi-title {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #7A2400 0%, #B73D00 45%, #E65100 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.3;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 13.5px;
      letter-spacing: 0.24em;
      color: #C44E00;
      text-transform: uppercase;
      font-weight: 700;
      opacity: 0.95;
    }

    .tagline {
      font-size: 15px;
      color: #6B4931;
      line-height: 1.55;
      max-width: 380px;
      margin-top: 2px;
      font-weight: 500;
    }

    /* ACTION CARD & RADIO BUTTON */
    .action-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid var(--card-border);
      border-radius: 28px;
      padding: 26px 22px;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    }

    .action-card:hover {
      border-color: rgba(255, 143, 0, 0.65);
      box-shadow: 0 24px 54px rgba(224, 110, 20, 0.18), 0 0 28px rgba(255, 143, 0, 0.2);
    }

    /* MAIN RADIO BUTTON */
    .radio-btn {
      width: 100%;
      max-width: 380px;
      padding: 16px 28px;
      border: none;
      outline: none;
      border-radius: 22px;
      background: var(--gold-gradient);
      color: #FFFFFF;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 10px 28px rgba(230, 81, 0, 0.42), inset 0 1.5px 1px rgba(255, 255, 255, 0.6);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .prayer-btn {
      background: linear-gradient(135deg, #D84315 0%, #F57C00 50%, #FF9800 100%);
      box-shadow: 0 10px 28px rgba(216, 67, 21, 0.38), inset 0 1.5px 1px rgba(255, 255, 255, 0.6);
    }

    .prayer-btn:hover {
      box-shadow: 0 14px 36px rgba(216, 67, 21, 0.52), inset 0 1.5px 1px rgba(255, 255, 255, 0.8);
    }

    .btn-arrow-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFF;
      transition: transform 0.25s ease;
    }

    .prayer-btn:hover .btn-arrow-icon {
      transform: translateX(3px);
    }

    .radio-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: left 0.6s ease;
    }

    .radio-btn:hover::before {
      left: 100%;
    }

    .radio-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 36px rgba(230, 81, 0, 0.55), inset 0 1.5px 1px rgba(255, 255, 255, 0.8);
    }

    .radio-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .radio-btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .radio-icon-box {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.24);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .radio-icon-box svg {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
    }

    .radio-btn-text {
      text-align: left;
      display: flex;
      flex-direction: column;
    }

    .radio-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.2;
      color: #FFFFFF;
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    .radio-sub {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.02em;
    }

    /* EQUALIZER ANIMATION */
    .equalizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      padding-right: 4px;
    }

    .eq-bar {
      width: 3.5px;
      background: #FFFFFF;
      border-radius: 2px;
      animation: eqBounce 1.2s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.4s; }
    .eq-bar:nth-child(3) { height: 14px; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 7px; animation-delay: 0.6s; }

    @keyframes eqBounce {
      0% { height: 4px; }
      50% { height: 18px; }
      100% { height: 8px; }
    }

    /* TRACK CHIPS INFO */
    .playlist-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 171, 92, 0.4);
      border-radius: 20px;
      font-weight: 600;
      color: #5D381E;
      box-shadow: 0 2px 8px rgba(224, 110, 20, 0.08);
    }

    .meta-chip span {
      color: var(--primary);
    }

    /* FOOTER */
    .footer {
      font-size: 13px;
      color: #7D5A42;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .footer strong {
      color: #C44E00;
      font-weight: 700;
    }

    /* SEAMLESS EMBEDDED PLAYER MODAL */
    .radio-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(255, 244, 230, 0.95);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: scale(0.96);
      display: flex;
      flex-direction: column;
    }

    .radio-modal.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .modal-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0F1117;
    }

    /* DISCREET MODAL CLOSE BAR */
    .modal-top-bar {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 1005;
      display: flex;
      gap: 10px;
    }

    .modal-bar-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(255, 143, 0, 0.35);
      color: #7A2400;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .modal-bar-btn:hover {
      background: #FFFFFF;
      border-color: rgba(255, 143, 0, 0.7);
      color: #E65100;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- AMBIENT BACKGROUND GLOWS -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- MINIMALISTIC HOMEPAGE CONTENT -->
  <main class="main-container">
    
    <!-- SACRED PORTRAIT -->
    <div class="portrait-wrapper">
      <div class="portrait-aura"></div>
      <div class="portrait-frame">
        <img 
          src="Playlist/util/MehiBabaFullPoster.png" 
          alt="Maharishi Mehi Paramhans Ji Maharaj" 
          class="portrait-img"
          loading="eager"
        >
      </div>
    </div>

    <!-- TITLE & DIVINE HEADER -->
    <div class="header-text">
      <h1 class="hindi-title">महर्षि मेंहीं परमहंस जी महाराज</h1>
      <div class="subtitle">Santmat Satsang & Bhajans</div>
      <p class="tagline">
        अंतर साधना और गुरु भक्ति की अमृतमयी वाणी एवं पावन भजनों का दिव्य संग्रह।
      </p>
    </div>

    <!-- MAIN ACTION CARD WITH BHAJAN & PRAYER BUTTONS -->
    <div class="action-card">
      
      <!-- BUTTON 1: BHAJAN (भजन) -->
      <button 
        id="bhajan-button" 
        class="radio-btn" 
        onclick="openRadioPlayer()" 
        title="महर्षि मेंहीं पावन भजन सुनें"
      >
        <div class="radio-btn-left">
          <div class="radio-icon-box">
            <!-- Music / Sound SVG -->
            <svg viewBox="0 0 24 24">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </div>
          <div class="radio-btn-text">
            <span class="radio-title">भजन</span>
            <span class="radio-sub">सत्संग एवं मधुर भजन संग्रह</span>
          </div>
        </div>

        <!-- ANIMATED EQUALIZER INDICATOR -->
        <div class="equalizer" aria-hidden="true">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </button>

      <!-- BUTTON 2: PRAYER (प्रार्थना) -->
      <button 
        id="prayer-button" 
        class="radio-btn prayer-btn" 
        onclick="openPrayerModal()" 
        title="संतमत स्तुति, विनती एवं आरती पाठ"
      >
        <div class="radio-btn-left">
          <div class="radio-icon-box">
            <!-- Diya / Prayer SVG -->
            <svg viewBox="0 0 24 24">
              <path d="M12 2C11.5 2 11 2.2 10.7 2.6c-1.4 1.9-2.7 4.2-2.7 6.4 0 2.2 1.8 4 4 4s4-1.8 4-4c0-2.2-1.3-4.5-2.7-6.4-.3-.4-.8-.6-1.3-.6zm0 2.5c.8 1.4 1.8 3.3 1.9 4.5 0 1.1-.9 2-1.9 2s-1.9-.9-1.9-2c0-1.2 1-3.1 1.9-4.5zM4 14c0 3.3 3.6 6 8 6s8-2.7 8-6H4zm8 8c-3.9 0-7.2-1.4-7.8-3.3h15.6c-.6 1.9-3.9 3.3-7.8 3.3z"/>
            </svg>
          </div>
          <div class="radio-btn-text">
            <span class="radio-title">प्रार्थना</span>
            <span class="radio-sub">स्तुति, विनती, सिद्धान्त एवं आरती</span>
          </div>
        </div>

        <div class="btn-arrow-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </button>

      <!-- QUICK STATS -->
      <div class="playlist-meta">
        <div class="meta-chip">
          <span>🪔</span> Mehi Baba Bhajans
        </div>
        <div class="meta-chip">
          <span>📖</span> स्तुति-आरती
        </div>
      </div>
    </div>

    <!-- REVERENT FOOTER -->
    <footer class="footer">
      <strong>जय गुरु महाराज</strong> • Santmat Devotional Portal
    </footer>

  </main>

  <!-- IMMERSIVE RADIO PLAYER OVERLAY -->
  <div id="radio-modal" class="radio-modal" aria-hidden="true">
    <div class="modal-top-bar">
      <!-- Direct tab open button -->
      <a 
        href="Playlist/util/player.html" 
        target="_blank" 
        class="modal-bar-btn" 
        title="Open player in full tab"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
      <!-- Close modal button -->
      <button 
        class="modal-bar-btn" 
        onclick="closeRadioPlayerApp()" 
        title="Close Radio Player"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <iframe 
      id="player-iframe" 
      class="modal-frame" 
      src="about:blank" 
      title="Maharishi Mehi Baba Music Player"
      allow="autoplay; encrypted-media"
    ></iframe>
  </div>

  <!-- IMMERSIVE PRAYER OVERLAY -->
  <div id="prayer-modal" class="radio-modal" aria-hidden="true">
    <div class="modal-top-bar">
      <!-- Direct tab open button -->
      <a 
        href="prayer.html" 
        target="_blank" 
        class="modal-bar-btn" 
        title="Open prayer in full tab"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
      <!-- Close modal button -->
      <button 
        class="modal-bar-btn" 
        onclick="closePrayerModal()" 
        title="Close Prayer"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <iframe 
      id="prayer-iframe" 
      class="modal-frame" 
      src="about:blank" 
      title="Santmat Prayer Reader"
    ></iframe>
  </div>

  <script>
    var playerIframe = document.getElementById('player-iframe');
    var radioModal = document.getElementById('radio-modal');
    var isPlayerLoaded = false;

    var prayerIframe = document.getElementById('prayer-iframe');
    var prayerModal = document.getElementById('prayer-modal');
    var isPrayerLoaded = false;

    function openRadioPlayer() {
      if (!isPlayerLoaded) {
        playerIframe.src = 'Playlist/util/player.html';
        isPlayerLoaded = true;
      }
      radioModal.classList.add('active');
      radioModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeRadioPlayerApp() {
      radioModal.classList.remove('active');
      radioModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    window.closeRadioPlayerApp = closeRadioPlayerApp;

    function openPrayerModal() {
      if (!isPrayerLoaded) {
        prayerIframe.src = 'prayer.html';
        isPrayerLoaded = true;
      }
      prayerModal.classList.add('active');
      prayerModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closePrayerModal() {
      prayerModal.classList.remove('active');
      prayerModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }
    window.closePrayerModal = closePrayerModal;

    // Handle Escape key to close any active modal
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (radioModal.classList.contains('active')) {
          closeRadioPlayerApp();
        }
        if (prayerModal.classList.contains('active')) {
          closePrayerModal();
        }
      }
    });
  </script>
</body>
</html>
